<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="title desc">
<title id="title">Request timeline</title><desc id="desc">TTFT, chunk gaps, stall, decode window and latency on one streamed request.</desc>
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
        --band:rgba(42,120,214,0.10); --box:#f3f2ee; --ring:rgba(11,11,11,0.10); }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s2:#d95926; --s3:#199e70;
          --band:rgba(57,135,229,0.16); --box:#242422; --ring:rgba(255,255,255,0.10); }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .t { font-size: 15px; font-weight: 600; }
  .l { font-size: 12.5px; fill: var(--ink2); }
  .m { font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .b { font-size: 12.5px; font-weight: 600; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .box { fill: var(--box); stroke: var(--ring); stroke-width: 1; }
  .arrow { stroke: var(--ink2); stroke-width: 1.5; fill: none; marker-end: url(#ah); }
  .dim { stroke: var(--ink2); stroke-width: 1; fill: none; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
  orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs>
<rect width="760" height="350" rx="8" style="fill:var(--surface)"/>
<text x="24.0" y="32.0" class="t" text-anchor="start" >One streamed request, as the tool records it</text>
<text x="24.0" y="52.0" class="l" text-anchor="start" >Every network read is stored with its arrival time, bytes and cumulative token count.</text>
<line x1="60" y1="150" x2="720" y2="150" class="axis"/>
<path d="M245.0,150.0 L245.0,139.0 Q245.0,136.0 248.0,136.0 L252.0,136.0 Q255.0,136.0 255.0,139.0 L255.0,150.0 Z" style="fill:var(--s1)"/>
<path d="M285.0,150.0 L285.0,111.0 Q285.0,108.0 288.0,108.0 L292.0,108.0 Q295.0,108.0 295.0,111.0 L295.0,150.0 Z" style="fill:var(--s1)"/>
<path d="M325.0,150.0 L325.0,125.0 Q325.0,122.0 328.0,122.0 L332.0,122.0 Q335.0,122.0 335.0,125.0 L335.0,150.0 Z" style="fill:var(--s1)"/>
<path d="M365.0,150.0 L365.0,111.0 Q365.0,108.0 368.0,108.0 L372.0,108.0 Q375.0,108.0 375.0,111.0 L375.0,150.0 Z" style="fill:var(--s1)"/>
<path d="M405.0,150.0 L405.0,139.0 Q405.0,136.0 408.0,136.0 L412.0,136.0 Q415.0,136.0 415.0,139.0 L415.0,150.0 Z" style="fill:var(--s1)"/>
<path d="M535.0,150.0 L535.0,111.0 Q535.0,108.0 538.0,108.0 L542.0,108.0 Q545.0,108.0 545.0,111.0 L545.0,150.0 Z" style="fill:var(--s1)"/>
<path d="M575.0,150.0 L575.0,125.0 Q575.0,122.0 578.0,122.0 L582.0,122.0 Q585.0,122.0 585.0,125.0 L585.0,150.0 Z" style="fill:var(--s1)"/>
<path d="M615.0,150.0 L615.0,111.0 Q615.0,108.0 618.0,108.0 L622.0,108.0 Q625.0,108.0 625.0,111.0 L625.0,150.0 Z" style="fill:var(--s1)"/>
<path d="M645.0,150.0 L645.0,125.0 Q645.0,122.0 648.0,122.0 L652.0,122.0 Q655.0,122.0 655.0,125.0 L655.0,150.0 Z" style="fill:var(--s1)"/>
<line x1="60" y1="90" x2="60" y2="156" class="dim"/>
<text x="60.0" y="84.0" class="m" text-anchor="middle" >request sent</text>
<line x1="690" y1="90" x2="690" y2="156" class="dim"/>
<text x="690.0" y="84.0" class="m" text-anchor="middle" >stream ends</text>
<line x1="60" y1="184" x2="250" y2="184" class="dim" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="155.0" y="178.0" class="b" text-anchor="middle" >TTFT</text>
<line x1="250" y1="184" x2="650" y2="184" class="dim" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="450.0" y="178.0" class="b" text-anchor="middle" >decode window: decode tok/s = tokens after first read ÷ time</text>
<line x1="410" y1="226" x2="540" y2="226" class="dim" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="475.0" y="220.0" class="b" text-anchor="middle" >max stall = largest gap between reads</text>
<line x1="290" y1="226" x2="330" y2="226" class="dim" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="310.0" y="220.0" class="m" text-anchor="middle" >chunk gap</text>
<line x1="60" y1="268" x2="690" y2="268" class="dim" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="375.0" y="262.0" class="m" text-anchor="middle" >end-to-end latency</text>
<text x="24.0" y="316.0" class="l" text-anchor="start" >Each bar is one network read; its height is the number of tokens that read carried.</text>
<text x="24.0" y="336.0" class="l" text-anchor="start" >Per-token ITL = chunk gap ÷ tokens it carried.  TPOT = decode window ÷ tokens after the first read.</text>
</svg>

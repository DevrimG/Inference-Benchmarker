<text x="24.0" y="190.0" class="m" text-anchor="start" >sent at precomputed random times;</text>
<text x="24.0" y="205.0" class="m" text-anchor="start" >overlap grows if the server slows</text>
<line x1="330" y1="218" x2="740" y2="218" class="axis"/>
<rect x="340" y="162" width="108" height="12" rx="3" style="fill:var(--s1)"/>

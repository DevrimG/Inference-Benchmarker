<line x1="630" y1="178" x2="630" y2="194" style="stroke:var(--ink);stroke-width:1.5"/>
<text x="24.0" y="252.0" class="b" text-anchor="start" >burst</text>
<text x="24.0" y="270.0" class="m" text-anchor="start" >exactly C requests released</text>
<text x="24.0" y="285.0" class="m" text-anchor="start" >at the same instant</text>
<line x1="330" y1="298" x2="740" y2="298" class="axis"/>

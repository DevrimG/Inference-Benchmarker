<line x1="330" y1="276" x2="330" y2="292" style="stroke:var(--ink);stroke-width:1.5"/>
<text x="24.0" y="332.0" class="b" text-anchor="start" >replay</text>
<text x="24.0" y="350.0" class="m" text-anchor="start" >sent at the offsets in a JSONL</text>
<text x="24.0" y="365.0" class="m" text-anchor="start" >trace (timestamp ms or offset_s)</text>
<line x1="330" y1="378" x2="740" y2="378" class="axis"/>

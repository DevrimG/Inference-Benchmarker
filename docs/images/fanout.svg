<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="title desc">
<title id="title">Fan-out</title><desc id="desc">Config splits concurrency across endpoints that share a start gate and merge results.</desc>
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
        --band:rgba(42,120,214,0.10); --box:#f3f2ee; --ring:rgba(11,11,11,0.10); }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s2:#d95926; --s3:#199e70;
          --band:rgba(57,135,229,0.16); --box:#242422; --ring:rgba(255,255,255,0.10); }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .t { font-size: 15px; font-weight: 600; }
  .l { font-size: 12.5px; fill: var(--ink2); }
  .m { font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .b { font-size: 12.5px; font-weight: 600; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .box { fill: var(--box); stroke: var(--ring); stroke-width: 1; }
  .arrow { stroke: var(--ink2); stroke-width: 1.5; fill: none; marker-end: url(#ah); }
  .dim { stroke: var(--ink2); stroke-width: 1; fill: none; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
  orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs>
<rect width="760" height="340" rx="8" style="fill:var(--surface)"/>
<text x="24.0" y="32.0" class="t" text-anchor="start" >Multi-endpoint fan-out</text>
<text x="24.0" y="52.0" class="l" text-anchor="start" >One client process, one start instant, one merged result with an endpoint column.</text>
<rect x="24" y="130" width="150" height="60" rx="6" class="box"/>
<text x="99.0" y="152.0" class="b" text-anchor="middle" >lab.toml</text>
<text x="99.0" y="170.0" class="m" text-anchor="middle" >concurrency 8, weights 2:1</text>
<rect x="214" y="130" width="150" height="60" rx="6" class="box"/>
<text x="289.0" y="152.0" class="b" text-anchor="middle" >StartGate</text>
<text x="289.0" y="170.0" class="m" text-anchor="middle" >warmup, then start together</text>
<rect x="414" y="80" width="160" height="60" rx="6" class="box"/>
<text x="494.0" y="102.0" class="b" text-anchor="middle" >endpoint A</text>
<text x="494.0" y="120.0" class="m" text-anchor="middle" >C = 5 (weight 2)</text>
<rect x="414" y="200" width="160" height="60" rx="6" class="box"/>
<text x="494.0" y="222.0" class="b" text-anchor="middle" >endpoint B</text>
<text x="494.0" y="240.0" class="m" text-anchor="middle" >C = 3 (weight 1)</text>
<rect x="614" y="130" width="122" height="60" rx="6" class="box"/>
<text x="675.0" y="152.0" class="b" text-anchor="middle" >merged result</text>
<text x="675.0" y="170.0" class="m" text-anchor="middle" >endpoint column</text>
<line x1="174" y1="160" x2="212" y2="160" class="arrow"/>
<line x1="364" y1="150" x2="412" y2="110" class="arrow"/>
<line x1="364" y1="170" x2="412" y2="230" class="arrow"/>
<line x1="574" y1="110" x2="612" y2="150" class="arrow"/>
<line x1="574" y1="230" x2="612" y2="170" class="arrow"/>
<text x="494.0" y="156.0" class="m" text-anchor="middle" >↕ /metrics scraped separately</text>
<text x="494.0" y="276.0" class="m" text-anchor="middle" >↕ /metrics scraped separately</text>
<text x="24.0" y="306.0" class="l" text-anchor="start" >Concurrency is split by weight (largest remainder). Open-loop rates are split the same way;</text>
<text x="24.0" y="324.0" class="l" text-anchor="start" >replay traces are dealt round-robin. Server agreement is reported per endpoint.</text>
</svg>

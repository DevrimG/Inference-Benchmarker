<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" role="img" aria-labelledby="title desc">
<title id="title">Workflow</title><desc id="desc">Install, configure, dry run, run, read outputs.</desc>
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
        --band:rgba(42,120,214,0.10); --box:#f3f2ee; --ring:rgba(11,11,11,0.10); }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s2:#d95926; --s3:#199e70;
          --band:rgba(57,135,229,0.16); --box:#242422; --ring:rgba(255,255,255,0.10); }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .t { font-size: 15px; font-weight: 600; }
  .l { font-size: 12.5px; fill: var(--ink2); }
  .m { font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .b { font-size: 12.5px; font-weight: 600; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .box { fill: var(--box); stroke: var(--ring); stroke-width: 1; }
  .arrow { stroke: var(--ink2); stroke-width: 1.5; fill: none; marker-end: url(#ah); }
  .dim { stroke: var(--ink2); stroke-width: 1; fill: none; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
  orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs>
<rect width="760" height="150" rx="8" style="fill:var(--surface)"/>
<text x="24.0" y="30.0" class="t" text-anchor="start" >Workflow</text>
<rect x="24" y="56" width="132" height="62" rx="6" class="box"/>
<text x="34.0" y="80.0" class="b" text-anchor="start" >1  install</text>
<text x="34.0" y="100.0" class="m" text-anchor="start" >requirements.txt</text>
<line x1="157" y1="87" x2="170" y2="87" class="arrow"/>
<rect x="171" y="56" width="132" height="62" rx="6" class="box"/>
<text x="181.0" y="80.0" class="b" text-anchor="start" >2  configure</text>
<text x="181.0" y="100.0" class="m" text-anchor="start" >lab.example.toml</text>
<line x1="304" y1="87" x2="317" y2="87" class="arrow"/>
<rect x="318" y="56" width="132" height="62" rx="6" class="box"/>
<text x="328.0" y="80.0" class="b" text-anchor="start" >3  dry run</text>
<text x="328.0" y="100.0" class="m" text-anchor="start" >--dry-run</text>
<line x1="451" y1="87" x2="464" y2="87" class="arrow"/>
<rect x="465" y="56" width="132" height="62" rx="6" class="box"/>
<text x="475.0" y="80.0" class="b" text-anchor="start" >4  run</text>
<text x="475.0" y="100.0" class="m" text-anchor="start" >--config lab.toml</text>
<line x1="598" y1="87" x2="611" y2="87" class="arrow"/>
<rect x="612" y="56" width="132" height="62" rx="6" class="box"/>
<text x="622.0" y="80.0" class="b" text-anchor="start" >5  read</text>
<text x="622.0" y="100.0" class="m" text-anchor="start" >lab_summary.json</text>
</svg>

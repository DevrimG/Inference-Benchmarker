<line x1="430" y1="320" x2="430" y2="336" style="stroke:var(--ink);stroke-width:1.5"/>
<rect x="435" y="340" width="123" height="12" rx="3" style="fill:var(--s1)"/>
<line x1="435" y1="338" x2="435" y2="354" style="stroke:var(--ink);stroke-width:1.5"/>
<rect x="440" y="358" width="88" height="12" rx="3" style="fill:var(--s1)"/>
<line x1="440" y1="356" x2="440" y2="372" style="stroke:var(--ink);stroke-width:1.5"/>
<rect x="630" y="322" width="78" height="12" rx="3" style="fill:var(--s1)"/>
<line x1="630" y1="320" x2="630" y2="336" style="stroke:var(--ink);stroke-width:1.5"/>

<line x1="425" y1="98" x2="425" y2="114" style="stroke:var(--ink);stroke-width:1.5"/>
<rect x="545" y="100" width="123" height="12" rx="3" style="fill:var(--s1)"/>
<line x1="545" y1="98" x2="545" y2="114" style="stroke:var(--ink);stroke-width:1.5"/>
<rect x="330" y="118" width="138" height="12" rx="3" style="fill:var(--s1)"/>
<line x1="330" y1="116" x2="330" y2="132" style="stroke:var(--ink);stroke-width:1.5"/>
<rect x="475" y="118" width="113" height="12" rx="3" style="fill:var(--s1)"/>
